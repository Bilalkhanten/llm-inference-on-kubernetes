apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: gpu-headroom
value: -10
globalDefault: false
description: "Placeholder capacity; preempted by real inference replicas"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-headroom
  namespace: inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gpu-headroom
  template:
    metadata:
      labels:
        app: gpu-headroom
    spec:
      priorityClassName: gpu-headroom
      terminationGracePeriodSeconds: 0
      resourceClaims:
      - name: gpu
        resourceClaimTemplateName: llm-gpu-70g
      containers:
      - name: pause
        image: registry.k8s.io/pause:3.10
        resources:
          claims:
          - name: gpu
