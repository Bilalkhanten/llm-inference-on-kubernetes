name: CI

# Pipeline graph (arrows are `needs:`):
#
#   lint ──┬──▶ validate (Kubernetes 1.34 - 1.37) ──┐
#          ├──▶ kustomize ──────────────────────────┼──▶ tools ──▶ screenshots
#          └──▶ test (Python 3.10, 3.12, 3.13) ─────┘
#
# lint         yamllint on manifests/                                   (make lint)
# validate     offline schema validation per Kubernetes version         (make validate)
# kustomize    `kubectl kustomize manifests/` renders offline; the opt-in files (05, 06) must stay out
# test         pytest, no cluster and no GPU needed                     (make test)
# tools        runs every tool once: kvcalc, captool, routesim, validate (make all)
# screenshots  re-renders docs/img/*.png from real tool output (uploaded; not compared byte for byte, since
#              Pillow and font versions change the pixels)
#
# Nothing here talks to a cluster. The manifests are checked against schemas and rendered, never applied.
# "Run workflow" on the Actions tab starts the pipeline by hand (workflow_dispatch).

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: make lint

  validate:
    name: validate (k8s ${{ matrix.k8s }})
    needs: [lint]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        k8s: ["1.34", "1.35", "1.36", "1.37"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: make validate K8S_VERSION=${{ matrix.k8s }}

  kustomize:
    name: kustomize
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render manifests/ offline
        run: |
          kubectl version --client
          kubectl kustomize manifests/ > "$RUNNER_TEMP/rendered.yaml"
          echo "objects rendered: $(grep -c '^kind:' "$RUNNER_TEMP/rendered.yaml")"
          grep '^kind:' "$RUNNER_TEMP/rendered.yaml" | sort | uniq -c
      - name: Opt-in files stay opt-in (05 placeholder pods, 06 agent RBAC)
        run: |
          if grep -qE '^kind: (PriorityClass|ClusterRole|ClusterRoleBinding|ServiceAccount)$' "$RUNNER_TEMP/rendered.yaml"; then
            echo "the default kustomization pulls in an opt-in file (05-gpu-headroom.yaml or 06-ai-ops-rbac.yaml)"; exit 1
          fi

  test:
    name: test (python ${{ matrix.python }})
    needs: [lint]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: make test

  tools:
    name: tools
    needs: [validate, kustomize, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run every tool once
        run: make all

  screenshots:
    name: screenshots
    needs: [tools]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Re-render docs/img from real tool output
        run: |
          make screenshots
          test "$(ls docs/img/*.png | wc -l)" -eq 5
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            docs/img/*.png
            out/*.txt
          retention-days: 14
